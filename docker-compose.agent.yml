services:
  research-agent:
    build: .
    env_file: .env
    environment:
      # This Compose file runs the agent in Docker; provider services are reached through the host.
      SEARXNG_URL: http://host.docker.internal:8080
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
