name: searchengine-searxng

services:
  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-change-this-secret}
      SEARXNG_LIMITER: "false"
      FORCE_OWNERSHIP: "false"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-cache:
